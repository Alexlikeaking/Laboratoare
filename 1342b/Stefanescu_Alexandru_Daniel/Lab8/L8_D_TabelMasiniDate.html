<!DOCTYPE html>
<html>
<head>
<title>Tabel masini - Date (Bonus)</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}
td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1> Masinile dorite (Doar date in Storage) </h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
  <button type="button" onclick="stergeToate()" style="background-color:red; color:white;">Sterge toate</button>
</form>

<p id="mesaj" style="color:red; font-weight:bold;"></p>

<p>
<table id="tm">
<tbody id="tb">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</tbody>
</table>
</p>

<script>
let masiniData = [];

function masina(mk, md, cl, an){
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
}

// Metoda plasată pe prototip; astfel JSON.stringify salvează doar atributele, fără metodă.
masina.prototype.randNou = function() {
  return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
}

// La încărcarea paginii, preluăm doar datele și reconstruim obiectele cu 'new'
if (localStorage.carsData) {
  let dateSalvate = JSON.parse(localStorage.carsData);
  for (let i = 0; i < dateSalvate.length; i++) {
    let item = dateSalvate[i];
    let instantaNoua = new masina(item.marca, item.model, item.culoare, item.anFab);
    masiniData.push(instantaNoua);
    document.getElementById("tb").innerHTML += instantaNoua.randNou();
  }
}

function valideaza(marca, model, culoare, an) {
  if (!marca.trim()) return "Marca nu poate conține doar spații.";
  if (!model.trim()) return "Modelul nu poate conține doar spații.";
  if (!culoare.trim()) return "Culoarea nu poate conține doar spații.";
  var anNum = Number(an);
  var anCurent = new Date().getFullYear();
  if (!Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
    return "Anul trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
  }
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").innerText = eroare;
    return false;
  }
  document.getElementById("mesaj").innerText = ""; 

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tb").innerHTML += mNoua.randNou(); 
  
  masiniData.push(mNoua);
  
  var myJSON = JSON.stringify(masiniData);
  localStorage.setItem("carsData", myJSON);
  
  return false;
}

function stergeToate() {
  localStorage.removeItem("carsData");
  masiniData = [];
  document.getElementById("tb").innerHTML = "<tr><th>Marca</th><th>Model</th><th>Culoare</th><th>An fabricatie</th></tr>";
}
</script>
</body>
</html>
