<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}
td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1> Masinile dorite </h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj" style="color:red; font-weight:bold;"></p>

<p>
<table id="tm">
<tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>
</p>

<script>
function masina(mk, md, cl, an){
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  }
}

var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

if(localStorage.masinaN) {
  var masinaJSON = localStorage.masinaN;
  var mNoua = JSON.parse(masinaJSON);
  if (mNoua.randNou !== undefined) {
    document.getElementById("tm").innerHTML += mNoua.randNou; // accesată ca proprietate de tip șir
  }
}

function valideaza(marca, model, culoare, an) {
  if (!marca.trim()) return "Marca nu poate conține doar spații.";
  if (!model.trim()) return "Modelul nu poate conține doar spații.";
  if (!culoare.trim()) return "Culoarea nu poate conține doar spații.";
  var anNum = Number(an);
  var anCurent = new Date().getFullYear();
  if (!Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
    return "Anul trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
  }
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").innerText = eroare;
    return false;
  }
  document.getElementById("mesaj").innerText = ""; 

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou(); 

  mNoua.randNou = mNoua.randNou().toString();
  var myJSON = JSON.stringify(mNoua);
  localStorage.setItem("masinaN", myJSON);

  return false;
}
</script>

<!-- Răspunsuri la Exercițiul 4:
(a) Ce conține cheia masinaN: Conține reprezentarea ca șir (string) JSON a ultimului obiect mașină adăugat, incluzând datele sale și valoarea string a metodei randNou.
(b) De ce înainte de JSON.stringify, metoda este convertită la șir prin mNoua.randNou = mNoua.randNou().toString(): Metoda JSON.stringify ignoră complet funcțiile dintr-un obiect. Fără această conversie la text, rândul HTML generat de metodă ar fi pierdut la salvare.
(c) De ce la reîncărcare se scrie mNoua.randNou fără paranteze: Deoarece JSON.parse întoarce un obiect de bază în care "randNou" a fost stocat anterior ca un simplu string ce conține structura HTML, nu ca o funcție. Nu poate fi apelat, doar citit ca proprietate.
(d) Câte mașini adăugate apar după reîncărcare, comparativ cu L8_A: La fel ca în L8_A, apare doar ultima mașină, deoarece cheia din Local Storage este suprascrisă la fiecare adăugare.
-->
</body>
</html>
