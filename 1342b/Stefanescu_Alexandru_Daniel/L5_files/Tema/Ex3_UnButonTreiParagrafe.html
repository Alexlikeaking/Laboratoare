<!DOCTYPE html>
<html>
<head>
    <script>
        function modificaParagrafe() {
            var p1 = document.getElementById("p1");
            var p2 = document.getElementById("p2");
            var p3 = document.getElementById("p3");

            p1.innerHTML = "Acesta este paragraful 1";
            p1.style.color = "red"; p1.style.backgroundColor = "lightgray";

            p2.innerHTML = "Acesta este paragraful 2";
            p2.style.color = "blue"; p2.style.backgroundColor = "yellow";

            p3.innerHTML = "Acesta este paragraful 3";
            p3.style.color = "green"; p3.style.backgroundColor = "pink";
        }
    </script>
</head>
<body>
    <p id="p1">Paragraf 1 vechi</p>
    <p id="p2">Paragraf 2 vechi</p>
    <p id="p3">Paragraf 3 vechi</p>
    <button onclick="modificaParagrafe()">Modifică</button>
</body>
</html>
