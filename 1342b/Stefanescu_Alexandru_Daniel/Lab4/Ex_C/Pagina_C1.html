<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS_C1</title>
    <style>
      #hd {
        font-variant: small-caps;
        color: magenta;
      }
      h1,
      caption {
        color: blue;
        background-color: #cccc00;
      }
      body {
        background-color: #ffffcc;
      }
      .center,
      p {
        text-align: center;
        color: red;
      }

      /* Exercițiile 4 și 6: Formatarea tabelului */
      table,
      th,
      td {
        border: 2px solid green;
        border-collapse: collapse;
        padding: 12px;
      }
      caption {
        color: white;
        background-color: orange;
        font-size: 24px;
        font-weight: bold;
        padding: 8px;
      }
      th {
        background-color: magenta;
      }
      td {
        background-color: orange;
      }
      td[rowspan] {
        background-color: magenta;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1 id="hd">Tabel special</h1>
    <p>Un tabel cu "celule lipite"</p>

    <table style="width: 100%">
      <caption>
        Echipe si hobby-uri
      </caption>
      <tr>
        <th>Echipa</th>
        <th>Nume</th>
        <th colspan="2">Pasiuni</th>
      </tr>
      <tr>
        <!-- Exercițiul 5: rowspan modificat din 2 în 3 pentru echipa Munte -->
        <td rowspan="3">Munte</td>
        <td>Popescu</td>
        <td>calatorii</td>
        <td>filatelie</td>
      </tr>
      <tr>
        <td>Ionescu</td>
        <td>planorism</td>
        <td>sah</td>
      </tr>
      <tr>
        <!-- Exercițiul 5: Membru nou în echipa Munte -->
        <td>Vasilescu</td>
        <td>alpinism</td>
        <td>fotografie</td>
      </tr>
      <tr>
        <!-- Exercițiul 5: rowspan modificat din 3 în 4 pentru echipa Mare -->
        <td rowspan="4">Mare</td>
        <td>Georgescu</td>
        <td>plaja</td>
        <td>dans</td>
      </tr>
      <tr>
        <td>Gigescu</td>
        <td>surf</td>
        <td>samba</td>
      </tr>
      <tr>
        <td>Mintescu</td>
        <td>politica</td>
        <td>delicateturi</td>
      </tr>
      <tr>
        <!-- Exercițiul 5: Membru nou în echipa Mare -->
        <td>Marinescu</td>
        <td>inot</td>
        <td>scufundari</td>
      </tr>
    </table>
  </body>
</html>
