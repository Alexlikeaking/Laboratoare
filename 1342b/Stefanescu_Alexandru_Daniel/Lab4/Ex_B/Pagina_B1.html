<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS_B1</title>
    <style>
      body {
        background-color: #ffffcc;
      }
      .center {
        text-align: center;
        color: white;
      }
      h1 {
        background-color: #00cc66;
        color: orange;
      }
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      /* Uniformizarea tabelului 2: chenar și padding pe tabel și pe toate celulele */
      .centre,
      .centre th,
      .centre td {
        border: 5px solid blue;
        padding: 15px;
      }
      /* Fundal propriu pentru tabelul 2, diferit de dunga galbenă a div-ului #s2 */
      table.centre {
        background-color: #b3e6ff;
      }
      #s1 {
        background-color: #00cc66;
      }
      /* Schimbarea fundalului primului tabel în albastru */
      #s1 table {
        background-color: blue;
      }
      #s2 {
        background-color: yellow;
      }
      div {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1 class="center">Tabele formatate</h1>
    <div id="s1">
      <table style="width: 100%" class="center">
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
          <th>Age</th>
        </tr>
        <tr>
          <td>Jill</td>
          <td>Smith</td>
          <td>50</td>
        </tr>
        <tr>
          <td>Eve</td>
          <td>Jackson</td>
          <td>94</td>
        </tr>
      </table>
      <br />
    </div>

    <!-- Am modificat width:50% în width:100% pentru ca tabelul 2 să ocupe tot rândul -->
    <div id="s2" style="width: 100%">
      <br />
      <table style="width: 100%" class="centre">
        <tr>
          <th class="centre">Firstname</th>
          <th class="centre">Lastname</th>
          <th class="centre">Age</th>
        </tr>
        <tr>
          <td class="centre">Jill</td>
          <td>Smith</td>
          <td>50</td>
        </tr>
        <tr>
          <td class="centre">Eve</td>
          <td>Jackson</td>
          <td>94</td>
        </tr>
      </table>
    </div>
  </body>
</html>
